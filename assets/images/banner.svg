
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#222" stroke-opacity=".07" stroke-width="1"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .12"/>
      </feComponentTransfer>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f5ef"/>
      <stop offset="1" stop-color="#e9e5dc"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="1" y="1" width="1198" height="358" rx="8"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#paper)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" filter="url(#grain)" opacity=".5"/>

    <path d="M760 0V360" stroke="#171717" stroke-opacity=".12"/>
    <path d="M790 0V360" stroke="#171717" stroke-opacity=".05"/>

    <!-- Quiet ocean illustration -->
    <g fill="none" stroke="#171717" stroke-width="1.5" opacity=".65">
      <path d="M790 250 Q850 225 910 250 T1030 250 T1200 240"/>
      <path d="M790 267 Q850 242 910 267 T1030 267 T1200 257" opacity=".6"/>
      <path d="M790 284 Q850 259 910 284 T1030 284 T1200 274" opacity=".4"/>
      <path d="M790 301 Q850 276 910 301 T1030 301 T1200 291" opacity=".3"/>
      <path d="M850 225 Q900 215 945 225" opacity=".35"/>
    </g>

    <circle cx="1030" cy="112" r="48" fill="none" stroke="#171717" stroke-opacity=".55"/>
    <circle cx="1030" cy="112" r="42" fill="#171717" fill-opacity=".035"/>

    <g fill="#171717" opacity=".7">
      <path d="M940 196l9-5 8 5-8-1z"/>
      <path d="M1090 207l7-4 7 4-7-1z"/>
      <path d="M1125 184l8-4 8 4-8-1z"/>
    </g>

    <!-- Typography -->
    <text x="82" y="78" fill="#77716a" font-family="monospace" font-size="13" letter-spacing="4">
      PERSONAL SPACE / 001
    </text>

    <text x="78" y="173" fill="#171717" font-family="Georgia, serif" font-size="76" font-weight="bold" letter-spacing="-3">
      silentwander
    </text>

    <circle cx="554" cy="148" r="5" fill="#8d2929"/>

    <text x="84" y="218" fill="#8d2929" font-family="Georgia, serif" font-size="32" font-style="italic">
      Finding my own way through code.
    </text>

    <path d="M84 247H650" stroke="#171717" stroke-opacity=".35"/>

    <text x="84" y="277" fill="#6f6a63" font-family="monospace" font-size="12" letter-spacing="2">
      DEVELOPER · BUILDER · EXPLORER
    </text>

    <text x="84" y="320" fill="#77716a" font-family="Georgia, serif" font-size="16" font-style="italic">
      Somewhere between thoughts and reality.
    </text>

    <text x="1115" y="330" fill="#77716a" font-family="monospace" font-size="11" text-anchor="end" letter-spacing="2">
      SILENCE / 01
    </text>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="8" fill="none" stroke="#171717" stroke-opacity=".25"/>
</svg>
